services:
  database-init:
    image: busybox:1.37.0
    command: ["sh", "-ec", "mkdir -p /data && chmod 0700 /data && chown 1001:1001 /data"]
    volumes:
      - app-data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    restart: "no"

  app:
    image: ${APP_IMAGE:-bikerental:local}
    depends_on:
      database-init:
        condition: service_completed_successfully
      radicale:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SITE_URL: ${SITE_URL:?SITE_URL must be set to the public HTTPS origin}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be set to the public HTTPS origin}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set to the public HTTPS origin}
      __NEXT_PRIVATE_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be set to the public HTTPS origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      DATABASE_URL: /data/bikerental.db
      CARDDAV_PUBLIC_URL: ${CARDDAV_PUBLIC_URL:?CARDDAV_PUBLIC_URL must be set to the public HTTPS CardDAV origin}
      CARDDAV_INTERNAL_URL: ${CARDDAV_INTERNAL_URL:-http://radicale:5232}
      CARDDAV_INTERNAL_ALLOWED_HOSTS: ${CARDDAV_INTERNAL_ALLOWED_HOSTS:-}
      CALENDAR_FEED_TOKEN: ${CALENDAR_FEED_TOKEN:-}
      MAIL_SYNC_TOKEN: ${MAIL_SYNC_TOKEN:-}
      OUTBOX_DISPATCH_TOKEN: ${OUTBOX_DISPATCH_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-}
      MAIL_USE_STARTTLS: ${MAIL_USE_STARTTLS:-}
      MAIL_TIMEOUT_SECONDS: ${MAIL_TIMEOUT_SECONDS:-20}
      SMTP_REQUEST_HOST: ${SMTP_REQUEST_HOST:-}
      SMTP_REQUEST_PORT: ${SMTP_REQUEST_PORT:-}
      SMTP_REQUEST_SECURE: ${SMTP_REQUEST_SECURE:-}
      SMTP_REQUEST_USER: ${SMTP_REQUEST_USER:-}
      SMTP_REQUEST_PASSWORD: ${SMTP_REQUEST_PASSWORD:-}
      SMTP_REQUEST_PASSWORD_FILE: ${SMTP_REQUEST_PASSWORD_FILE:-}
      MAIL_REQUEST_FROM_ADDRESS: ${MAIL_REQUEST_FROM_ADDRESS:-anfrage@munich-bike-rental.de}
      MAIL_REQUEST_TO_ADDRESS: ${MAIL_REQUEST_TO_ADDRESS:-hallo@munich-bike-rental.de}
      SMTP_MAIN_HOST: ${SMTP_MAIN_HOST:-}
      SMTP_MAIN_PORT: ${SMTP_MAIN_PORT:-}
      SMTP_MAIN_SECURE: ${SMTP_MAIN_SECURE:-}
      SMTP_MAIN_USER: ${SMTP_MAIN_USER:-}
      SMTP_MAIN_PASSWORD: ${SMTP_MAIN_PASSWORD:-}
      SMTP_MAIN_PASSWORD_FILE: ${SMTP_MAIN_PASSWORD_FILE:-}
      MAIL_MAIN_FROM_ADDRESS: ${MAIL_MAIN_FROM_ADDRESS:-hallo@munich-bike-rental.de}
      IMAP_MAIN_HOST: ${IMAP_MAIN_HOST:-}
      IMAP_MAIN_PORT: ${IMAP_MAIN_PORT:-993}
      IMAP_MAIN_SECURE: ${IMAP_MAIN_SECURE:-true}
      IMAP_MAIN_USER: ${IMAP_MAIN_USER:-}
      IMAP_MAIN_PASSWORD: ${IMAP_MAIN_PASSWORD:-}
      IMAP_MAIN_PASSWORD_FILE: ${IMAP_MAIN_PASSWORD_FILE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-middle}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEVLO_CLIENT_ID: ${NEVLO_CLIENT_ID:-}
      NEVLO_ACCESS_TOKEN: ${NEVLO_ACCESS_TOKEN:-}
      NEVLO_REFRESH_TOKEN: ${NEVLO_REFRESH_TOKEN:-}
      NEVLO_ACCOUNT_ID: ${NEVLO_ACCOUNT_ID:-}
      NEVLO_SYNC_DATE_FROM: ${NEVLO_SYNC_DATE_FROM:-}
      NEVLO_SYNC_DATE_TO: ${NEVLO_SYNC_DATE_TO:-}
    volumes:
      - app-data:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${APP_PIDS_LIMIT:-128}
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1);});
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  radicale:
    image: ${RADICALE_IMAGE:-tomsquest/docker-radicale:3.6.1.0}
    expose:
      - "5232"
    volumes:
      - radicale-data:/data
      - ./radicale/config:/etc/radicale:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    restart: unless-stopped

  backup:
    build:
      context: ./backup
    image: ${BACKUP_IMAGE:-bikerental-backup:local}
    pull_policy: build
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      RESTIC_REPOSITORY: /backup/restic-repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Rome}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
    volumes:
      - app-data:/source:ro
      - radicale-data:/radicale-source:ro
      - ${BACKUP_DIR:-./backups}:/backup
    secrets:
      - restic-password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /etc/crontabs:rw,noexec,nosuid,nodev,size=16k
      - /run:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    restart: unless-stopped

volumes:
  app-data:
  radicale-data:

secrets:
  restic-password:
    file: ${BACKUP_RESTIC_PASSWORD_FILE:-./secrets/restic-password}
