services:
  database-init:
    image: busybox:1.37.0
    command: ["sh", "-ec", "mkdir -p /data && chown 1001:1001 /data && chmod 0700 /data"]
    volumes:
      - app-data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    restart: "no"

  app:
    image: ${APP_IMAGE:-bikerental:local}
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      DATABASE_URL: /data/bikerental.db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-}
      MAIL_USE_STARTTLS: ${MAIL_USE_STARTTLS:-}
      MAIL_TIMEOUT_SECONDS: ${MAIL_TIMEOUT_SECONDS:-20}
      SMTP_REQUEST_HOST: ${SMTP_REQUEST_HOST:-}
      SMTP_REQUEST_PORT: ${SMTP_REQUEST_PORT:-}
      SMTP_REQUEST_SECURE: ${SMTP_REQUEST_SECURE:-}
      SMTP_REQUEST_USER: ${SMTP_REQUEST_USER:-}
      SMTP_REQUEST_PASSWORD: ${SMTP_REQUEST_PASSWORD:-}
      SMTP_REQUEST_PASSWORD_FILE: ${SMTP_REQUEST_PASSWORD_FILE:-}
      MAIL_REQUEST_FROM_ADDRESS: ${MAIL_REQUEST_FROM_ADDRESS:-anfrage@munich-bike-rental.de}
      MAIL_REQUEST_TO_ADDRESS: ${MAIL_REQUEST_TO_ADDRESS:-hallo@munich-bike-rental.de}
      SMTP_MAIN_HOST: ${SMTP_MAIN_HOST:-}
      SMTP_MAIN_PORT: ${SMTP_MAIN_PORT:-}
      SMTP_MAIN_SECURE: ${SMTP_MAIN_SECURE:-}
      SMTP_MAIN_USER: ${SMTP_MAIN_USER:-}
      SMTP_MAIN_PASSWORD: ${SMTP_MAIN_PASSWORD:-}
      SMTP_MAIN_PASSWORD_FILE: ${SMTP_MAIN_PASSWORD_FILE:-}
      MAIL_MAIN_FROM_ADDRESS: ${MAIL_MAIN_FROM_ADDRESS:-hallo@munich-bike-rental.de}
      IMAP_MAIN_HOST: ${IMAP_MAIN_HOST:-}
      IMAP_MAIN_PORT: ${IMAP_MAIN_PORT:-993}
      IMAP_MAIN_SECURE: ${IMAP_MAIN_SECURE:-true}
      IMAP_MAIN_USER: ${IMAP_MAIN_USER:-}
      IMAP_MAIN_PASSWORD: ${IMAP_MAIN_PASSWORD:-}
      IMAP_MAIN_PASSWORD_FILE: ${IMAP_MAIN_PASSWORD_FILE:-}
      IMAP_MAIN_SENT_MAILBOX: ${IMAP_MAIN_SENT_MAILBOX:-Sent}
      IMAP_MAIN_REJECTED_MAILBOX: ${IMAP_MAIN_REJECTED_MAILBOX:-Abgelehnt}
      IMAP_MAIN_PENDING_MAILBOX: ${IMAP_MAIN_PENDING_MAILBOX:-Ausstehend}
    volumes:
      - app-data:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${APP_PIDS_LIMIT:-128}
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1);});
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
